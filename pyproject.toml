[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qacalc"
version = "0.1.0"
description = "Simple typed add/subtract calculator functions."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
qacalc = "qacalc.cli:main"
