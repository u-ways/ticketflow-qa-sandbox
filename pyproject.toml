[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qacalc"
version = "0.1.0"
description = "A minimal calculator package providing basic add and subtract operations."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
qacalc = "qacalc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qacalc"]
